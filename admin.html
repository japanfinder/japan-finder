<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAPAN FINDER | Staff</title><style>body{font:15px system-ui,sans-serif;background:#f6f8f6;color:#173826;max-width:820px;margin:35px auto;padding:0 16px}h1{font-size:24px}input,select,textarea{padding:10px;border:1px solid #cbd9cd;border-radius:8px;max-width:100%;box-sizing:border-box}button{background:#176b49;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}.item{background:#fff;padding:18px;border:1px solid #dbe7dd;border-radius:14px;margin:13px 0}.item input,.item select,.item textarea{display:block;width:100%;margin:7px 0}.small{font-size:12px;color:#607367;overflow-wrap:anywhere}.item a{color:#176b49}</style></head><body><h1>JAPAN FINDER · Staff review</h1><p>運営者だけが購入可否を判断する管理画面。確認済みの商品だけ「購入可能」にしてください。</p><label>Admin key (Cloudflare secret) <input id="key" type="password" autocomplete="off"></label> <button id="load">依頼を読み込む</button><p id="message" role="status"></p><div id="items"></div><script>
const $=id=>document.getElementById(id);let key='';
$('load').onclick=async()=>{key=$('key').value;$('key').value='';$('message').textContent='読み込み中…';try{const r=await fetch('/api/admin/requests',{headers:{Authorization:'Bearer '+key}});if(!r.ok)throw Error('ログイン失敗またはサーバー未設定');const data=await r.json();$('items').replaceChildren();for(const item of data.items){const box=document.createElement('div');box.className='item';const title=document.createElement('strong');title.textContent=item.name;const url=document.createElement('a');url.href=item.url;url.target='_blank';url.rel='noopener noreferrer';url.textContent='商品ページを開く ↗';const detail=document.createElement('p');detail.className='small';detail.textContent='依頼 '+item.requestId+' · 掲載価格 '+(item.listedPrice===null?'未入力':'¥'+item.listedPrice.toLocaleString('ja-JP'));const status=document.createElement('select');for(const [v,t] of [['pending','確認待ち'],['approved','購入可能（運営確認済み）'],['rejected','購入不可'],['more_info','追加情報が必要'],['cancelled','お客様がキャンセル済み']]){const o=document.createElement('option');o.value=v;o.textContent=t;status.append(o)}status.value=item.status;if(item.status==='cancelled')status.disabled=true;const price=document.createElement('input');price.type='number';price.min='0';price.placeholder='運営確認価格（任意）';price.value=item.approvedPrice??'';const reason=document.createElement('textarea');reason.rows=2;reason.maxLength=500;reason.placeholder='理由（例：売り切れ、配送不可、出品者確認中）';reason.value=item.reason||'';const save=document.createElement('button');save.textContent=item.status==='cancelled'?'キャンセル済み':'判定を保存';if(item.status==='cancelled')save.disabled=true;const msg=document.createElement('p');msg.className='small';save.onclick=async()=>{msg.textContent='保存中…';try{const r=await fetch('/api/admin/requests',{method:'PATCH',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({id:item.id,status:status.value,reason:reason.value,approvedPrice:price.value===''?null:Number(price.value)})});if(!r.ok)throw Error('保存できませんでした');msg.textContent='保存しました。購入者が「Refresh review status」を押すと反映されます。'}catch(e){msg.textContent=e.message}};box.append(title,document.createElement('br'),url,detail,status,price,reason,save,msg);$('items').append(box)}$('message').textContent=data.items.length+' 件を表示'}catch(e){$('message').textContent=e.message}};
</script></body></html>
